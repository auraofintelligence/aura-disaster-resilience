name: Publish companion website
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'website/**'
      - 'LICENCE.md'
      - 'robots.txt'
      - '.github/robots-root-snippet.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: companion-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            website
            site
            .github
      - name: Rebuild and check static pages
        run: |
          python3 website/build.py
          python3 website/check.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
